# CI for a kama package. This is the shape the next @kama package should copy.
#
# ⚠️ NOT YET SEEN GREEN. Until kama 0.9.440 (2026-09-23) there was no public release for the install
# step to resolve, and this file pinned v0.9.208, which was never released. Both prerequisites exist now
# — this repository's remote, and a public kama — and tools/test.sh passes locally on the pinned
# release. See docs/ROADMAP.md § LATER.
#
# What it does and does not do:
#   - It installs a kama toolchain and runs tools/test.sh, which is the whole gate: the tests build in
#     debug AND release (a release-only miscompile is a real class of bug), and examples/udp_channel is
#     built and run as an end-to-end case.
#   - It does NOT install libsodium. That is the point of vendoring it under third_party/ and compiling
#     it through `csources` — a consumer of this package needs nothing on the machine either.
#   - The matrix is linux-x64 and macOS. A windows-x64 release exists as of 0.9.440, but this package
#     has never been built on Windows; add windows-latest once it has.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Every manifest here declares `"kama": ">=0.9.457"`: the root's `publish` key is unreadable to an
      # older compiler, and tests/ and the example path-depend on the root. Pinning KAMA_VERSION here
      # rather than taking `latest` keeps a compiler release from turning this repository red without a
      # commit; raise it deliberately, the same way a manifest floor is raised.
      - name: Install kama
        env:
          KAMA_VERSION: v0.9.457
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: Version
        run: kama --version

      # tools/test.sh takes the compiler from $KAMA or the PATH. It is on the PATH here; set KAMA to
      # point at a local build instead when running this locally.
      - name: Test
        run: tools/test.sh
