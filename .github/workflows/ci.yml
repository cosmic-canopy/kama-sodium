# CI for a kama package. This is the shape the next @kama package should copy.
#
# ⚠️ THIS WORKFLOW HAS NEVER RUN. There is no git remote on this repository yet, and kama is not public,
# so the install step below cannot resolve. Both are prerequisites, not bugs in this file — see
# docs/ROADMAP.md § "Before this can really be published". When they exist, push and it should go green
# with no edits.
#
# What it does and does not do:
#   - It installs a kama toolchain and runs tools/test.sh, which is the whole gate: the tests build in
#     debug AND release (a release-only miscompile is a real class of bug), and examples/udp_channel is
#     built and run as an end-to-end case.
#   - It does NOT install libsodium. That is the point of vendoring it under third_party/ and compiling
#     it through `csources` — a consumer of this package needs nothing on the machine either.
#   - The matrix is the two hosts a kama release exists for. Add windows-latest when it does.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The manifest declares `"kama": ">=0.9.208"`. Pinning KAMA_VERSION here rather than taking
      # `latest` keeps a compiler release from turning this repository red without a commit; raise it
      # deliberately, the same way the manifest floor is raised.
      - name: Install kama
        env:
          KAMA_VERSION: v0.9.208
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: Version
        run: kama --version

      # tools/test.sh takes the compiler from $KAMA or the PATH. It is on the PATH here; set KAMA to
      # point at a local build instead when running this locally.
      - name: Test
        run: tools/test.sh
